spring.application.name=backend
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/monitoring
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Session/transaction pooler (Supabase) : évite les prepared statements incompatibles
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Email Configuration (set SPRING_MAIL_PASSWORD in the environment)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth 2.0 (public client ID — also in the frontend .env)
google.client.id=788525827235-qcv2ovgs9v1hif54lv38c8bgtcskdmn5.apps.googleusercontent.com

# 2FA : true par défaut. false = connexion email/Google sans Authenticator.
# Postgres localhost ignore aussi la 2FA (voir AuthController).
watchdesk.auth.totp-required=${WATCHDESK_TOTP_REQUIRED:true}

# Gemini : clé dans GEMINI_API_KEY ou application-local.properties (non versionné)
spring.config.import=optional:classpath:application-local.properties
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-2.5-flash}
